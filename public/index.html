<!doctype html>
<html lang="zh-CN" data-case="etf-flow">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="打开 FtShare 市场研究看板，或贡献你自己的开源看板。">
  <title>FtShare 看板库</title>
  <link rel="stylesheet" href="/library/style.css">
  <script type="module" src="/library/app.js"></script>
</head>
<body>
  <div class="layout">
    <aside class="rail" aria-label="看板库导航">
      <header class="rail-heading">
        <a class="brand" href="/" aria-label="FtShare 看板库首页">看板库</a>
      </header>
      <div class="rail-directory">
        <input id="search" type="search" placeholder="搜索看板" aria-label="搜索看板" autocomplete="off" hidden>
        <nav id="directory" aria-label="看板"></nav>
        <p id="directory-empty" class="muted" role="status" hidden>没有匹配的看板。</p>
      </div>
      <footer class="rail-footer">
        <p class="credit" id="case-credit" hidden></p>
        <div class="case-actions" id="case-actions" hidden>
          <button id="share" type="button">复制链接</button>
          <a id="source" target="_blank" rel="noopener noreferrer">独立打开</a>
        </div>
        <a class="contribute" id="contribute" href="/contribute">贡献看板</a>
      </footer>
    </aside>
    <main class="case" aria-label="看板内容">
      <p id="case-loading" class="loading" role="status">正在打开看板…</p>
      <div class="viewer" id="viewer"></div>
      <p id="status" class="toast" role="status" hidden></p>
    </main>
  </div>
</body>
</html>
