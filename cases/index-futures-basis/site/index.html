<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>股指期货基差</title>
<link rel="stylesheet" href="./style.css">
<script type="module" src="./basis.js"></script>
</head>
<body>
<main>
  <header><div><h1>股指期货基差</h1><p>期货收盘减现货收盘 · 合成样例</p></div>
    <div class="controls">
      <label>股指 <select id="index"><option value="IF">沪深 300（IF）</option><option value="IC">中证 500（IC）</option><option value="IM">中证 1000（IM）</option></select></label>
      <label>区间 <select id="window"><option value="20">近 20 日</option><option value="60">近 60 日</option></select></label>
    </div>
  </header>
  <section class="numbers" aria-label="区间概览">
    <div><p>最后观测日</p><strong id="latest-date"></strong></div>
    <div><p>最新基差</p><strong id="last"></strong></div>
    <div><p>区间平均基差</p><strong id="average"></strong></div>
    <div><p>贴水交易日</p><strong id="under"></strong></div>
  </section>
  <section class="plot" aria-labelledby="chart-title">
    <h2 id="chart-title">基差走势</h2>
    <p id="chart-summary" role="status"></p>
    <canvas id="chart" role="img" aria-labelledby="chart-title chart-summary"></canvas>
    <span id="readout" aria-hidden="true"></span>
    <p class="legend"><span class="positive">●</span> 升水 <span class="negative">●</span> 贴水 · 单位为点</p>
  </section>
  <details><summary>查看区间数据</summary>
  <table><thead><tr><th>日期</th><th>期货收盘</th><th>现货收盘</th><th>基差</th></tr></thead><tbody id="data"></tbody></table>
  </details>
</main>
</body>
</html>
