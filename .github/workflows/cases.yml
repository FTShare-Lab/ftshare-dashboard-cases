name: Validate cases
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run validate
      - run: npm test
      - if: github.event_name == 'push'
        run: node src/export.js .local/publish
      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .local/publish
  publish:
    if: github.event_name == 'push'
    needs: validate
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
